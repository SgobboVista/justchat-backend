services:
  justchat-backend:
    image: ghcr.io/sgobbovista/justchat-backend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - justchat-db
    ports:
      - "50070:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      NODE_ENV: production
      PORT: 80
      APP_NAME: JustChat
      ADMIN_USER: admin
      ADMIN_PASSWORD: "admin"
      AUTH_SECRET: "bitte-einen-langen-zufaelligen-wert-setzen"
      DATABASE_URL: "postgres://justchat:justchat_password@justchat-db:5432/justchat"
      DB_SSL: "false"
      SMTP_HOST: "webspace31.do.de"
      SMTP_PORT: "587"
      SMTP_USER: "kontakt@sgobbovista.de"
      SMTP_PASSWORD: "HIER_DAS_NEUE_MAIL_PASSWORT_EINTRAGEN"
      SMTP_FROM: "kontakt@sgobbovista.de"
      PUBLIC_BASE_URL: "http://DEINE-TRUENAS-IP:50070"
      GOOGLE_CLIENT_ID: "769973393963-2vosgga0eisngofob5kqmdbqvs0qqv77.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      FORBIDDEN_WORDS: "admin,administrator,moderator,system,support,root"
      IMAGE_UPDATE_WEBHOOK_URL: "http://justchat-image-updater:8080/v1/update"
      IMAGE_UPDATE_WEBHOOK_METHOD: "GET"
      IMAGE_UPDATE_WEBHOOK_TOKEN: "${IMAGE_UPDATE_WEBHOOK_TOKEN:-bitte-einen-langen-geheimen-update-token-setzen}"

  justchat-image-updater:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${IMAGE_UPDATE_WEBHOOK_TOKEN:-bitte-einen-langen-geheimen-update-token-setzen}"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  justchat-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: justchat
      POSTGRES_USER: justchat
      POSTGRES_PASSWORD: "justchat_password"
    volumes:
      - justchat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justchat -d justchat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  justchat-db-data:
